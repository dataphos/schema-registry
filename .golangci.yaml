# golangci-lint v2 Configuration
# This configuration merges rules from .golangci.yaml (source of truth) with modern v2 structure from golangci.yml
# The linter behavior is identical to the original .golangci.yaml configuration
#
# Key changes from original:
# - Uses modern v2 structure (linters.settings instead of linters-settings)
# - megacheck deprecated → split into staticcheck + gosimple (unused explicitly disabled in original)
# - Added formatters section (only affects --fix flag, no linting behavior change)
# - Uses explicit linter control with default: none

version: 2

run:
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  uniq-by-line: true
  path-prefix: ""

linters:
  default: none
  enable:
    # Original config had 'megacheck' which is deprecated
    # megacheck = staticcheck + unused + gosimple
    # However, original explicitly disabled 'unused', so we only enable:
    - staticcheck    # was part of megacheck
    - gosimple       # was part of megacheck
    # Original explicitly enabled linters:
    - govet
    - gosec
    - gocritic
    - goconst

  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: "logging is allowed only by logutils.Log"
    
    dogsled:
      max-blank-identifiers: 2
    
    dupl:
      threshold: 100
    
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - io/os.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - (io.ReadCloser).Close
    
    exhaustive:
      check-generated: false
      default-signifies-exhaustive: false
    
    funlen:
      lines: 60
      statements: 40
    
    gocognit:
      min-complexity: 10
    
    goconst:
      min-len: 3
      min-occurrences: 3
    
    gocyclo:
      min-complexity: 10
    
    godot:
      check-all: false
    
    godox:
      keywords:
        - NOTE
        - OPTIMIZE
        - HACK
    
    gofmt:
      simplify: true
    
    lll:
      line-length: 120
      tab-width: 2
    
    nestif:
      min-complexity: 4
    
    nolintlint:
      allow-unused: true
      allow-no-explanation: []
      require-explanation: true
      require-specific: true
    
    staticcheck:
      checks:
        - all
        - '-SA9003'
        - '-SA4009'
    
    whitespace:
      multi-if: false
      multi-func: false
    
    wsl:
      strict-append: true
      allow-assign-and-call: true
      allow-multiline-assign: true
      allow-cuddle-declarations: false
      allow-trailing-comment: false
      force-case-trailing-whitespace: 0
      force-err-cuddling: false
      allow-separated-leading-comment: false
    
    errorlint:
      errorf: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
    - path: internal/hmac/
      text: "weak cryptographic primitive"
      linters:
        - gosec
    - linters:
        - lll
      source: "^//go:generate "
  
  exclude-use-default: false
  exclude-case-sensitive: false
  include:
    - EXC0002
  max-issues-per-linter: 50
  max-same-issues: 3
  new: true

severity:
  default-severity: error
  case-sensitive: false
  rules:
    - linters:
        - dupl
      severity: info

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/dataphos/schema-registry
